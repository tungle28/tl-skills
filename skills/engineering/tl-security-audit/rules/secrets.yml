# Secret detection. Every rule sets `secret: true` so the matched value is redacted in all output:
# the report must never become a second copy of the leaked credential.
rules:
  - id: secret-private-key
    title: Private key committed to the repository
    languages: [any]
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |PGP )?PRIVATE KEY(?: BLOCK)?-----'
    severity: critical
    confidence: high
    owasp: A04
    cwe: CWE-321
    message: A private key in source control is readable by everyone with repository access, in every clone and in git history.
    fix: Revoke/rotate the key, load it from a secret store or mounted file at runtime, and purge it from history if the repo is shared.
    examples:
      bad: ["-----BEGIN RSA PRIVATE KEY-----", "-----BEGIN OPENSSH PRIVATE KEY-----"]
      good: ["-----BEGIN PUBLIC KEY-----", "-----BEGIN CERTIFICATE-----"]

  - id: secret-key-file
    title: Key or certificate store file committed
    languages: [key]
    path_pattern: '\.(pem|key|p12|pfx)$'
    file_excludes: 'BEGIN (PUBLIC KEY|CERTIFICATE)-----'
    severity: high
    confidence: medium
    owasp: A04
    cwe: CWE-321
    message: Key material files (.pem/.key/.p12/.pfx) usually contain private keys or password-protected keystores.
    fix: Confirm whether it contains a private key; if so rotate it and move it to a secret store. Add the extension to .gitignore.
    examples:
      file: certs/server.key
      bad: ["binary-or-key-content"]

  - id: secret-aws-access-key
    title: AWS access key id
    languages: [any]
    pattern: '\b((?:AKIA|ASIA)[0-9A-Z]{16})\b'
    secret: true
    secret_group: 1
    severity: critical
    confidence: high
    owasp: A04
    cwe: CWE-798
    message: An AWS access key id is present; the matching secret key is usually nearby.
    fix: Deactivate the key in IAM, rotate, and use IAM roles / instance profiles / OIDC federation instead of static keys.
    examples:
      bad: ['aws_access_key_id = AKIAIOSFODNN7EXAMPLQ']
      good: ['aws_access_key_id = os.environ["AWS_ACCESS_KEY_ID"]']

  - id: secret-github-token
    title: GitHub token
    languages: [any]
    pattern: '\b((?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,})\b'
    secret: true
    secret_group: 1
    severity: critical
    confidence: high
    owasp: A04
    cwe: CWE-798
    message: A GitHub token grants API access with the owner's scopes (often repo read/write).
    fix: Revoke the token in GitHub settings, use GITHUB_TOKEN or a GitHub App in CI, and store any PAT in a secret store.
    examples:
      bad: ['token: ghp_1234567890abcdefghijklmnopqrstuvwxyzAB']
      good: ['token: ${{ secrets.GITHUB_TOKEN }}']

  - id: secret-slack-token
    title: Slack token or webhook
    languages: [any]
    pattern: '\b(xox[baprs]-[A-Za-z0-9-]{10,}|https://hooks\.slack\.com/services/[A-Za-z0-9/]{20,})'
    secret: true
    secret_group: 1
    severity: high
    confidence: high
    owasp: A04
    cwe: CWE-798
    message: Slack tokens/webhooks allow posting to (and with bot tokens, reading) workspace channels.
    fix: Revoke in Slack admin, move to a secret store.
    examples:
      bad: ['SLACK="xoxb-1234567890-abcdefghij"']
      good: ['SLACK = process.env.SLACK_TOKEN']

  - id: secret-stripe-live-key
    title: Stripe live secret key
    languages: [any]
    pattern: '\b((?:sk|rk)_live_[0-9A-Za-z]{20,})\b'
    secret: true
    secret_group: 1
    severity: critical
    confidence: high
    owasp: A04
    cwe: CWE-798
    message: A live Stripe secret key can create charges, refunds and read customer data.
    fix: Roll the key in the Stripe dashboard immediately; load from a secret store.
    examples:
      # \x5f is "_": the parsed example is a Stripe-shaped key, but the raw file is not, so secret
      # scanners (GitHub push protection) do not block a push of this rule pack.
      bad: ["const k = \"sk\x5flive_51H8abcdefghijklmnopqrstu\""]
      good: ['const k = "pk_live_51H8abcdefghijklmnopqrstu"']

  - id: secret-google-api-key
    title: Google API key
    languages: [any]
    pattern: '\b(AIza[0-9A-Za-z_\-]{35})\b'
    secret: true
    secret_group: 1
    severity: high
    confidence: medium
    owasp: A04
    cwe: CWE-798
    message: Google API keys are often shipped to browsers on purpose (Maps), but unrestricted keys can be abused for billable APIs.
    fix: Restrict the key by HTTP referrer / IP and API; if it is a server key, move it out of source and rotate.
    examples:
      bad: ['key=AIzaSyA1234567890abcdefghijklmnopqrstuv']
      good: ['key=process.env.GOOGLE_KEY']

  - id: secret-llm-api-key
    title: LLM provider API key (OpenAI / Anthropic)
    languages: [any]
    pattern: '\b(sk-ant-[A-Za-z0-9_\-]{20,}|sk-(?:proj-)?[A-Za-z0-9_\-]{32,})\b'
    secret: true
    secret_group: 1
    entropy_min: 3.5
    severity: critical
    confidence: medium
    owasp: A04
    cwe: CWE-798
    message: LLM API keys are billed per use; a leaked key can run up large costs and expose prompts/data.
    fix: Revoke and rotate the key in the provider console; set spend limits; call the API from a server that reads the key from a secret store.
    examples:
      bad: ['ANTHROPIC_API_KEY="sk-ant-api03-Zx9Qw8Er7Ty6Ui5Op4As3Df2Gh1"']
      good: ['ANTHROPIC_API_KEY=os.environ["ANTHROPIC_API_KEY"]']

  - id: secret-jwt-literal
    title: Hardcoded JWT
    languages: [any]
    pattern: '\b(eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,})'
    secret: true
    secret_group: 1
    severity: medium
    confidence: medium
    owasp: A07
    cwe: CWE-798
    message: A literal JWT may be a long-lived bearer credential (service token, admin session).
    fix: Check its expiry and claims; if valid or long-lived, revoke (rotate the signing key if needed) and obtain tokens at runtime.
    examples:
      bad: ['Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0In0.abcdefghijklmnop']
      good: ['Authorization: Bearer ${token}']

  - id: secret-connection-string-password
    title: Connection string with embedded password
    languages: [any]
    pattern: '(?i)(?:Password|Pwd)\s*=\s*([^;"''\s{}$<>]{4,})\s*[;"'']'
    pattern_not: '(?i)(?:Password|Pwd)\s*=\s*(?:\*+|\$\{|\{\{|%|<|your_?password|changeme|password)'
    secret: true
    secret_group: 1
    severity: high
    confidence: medium
    owasp: A04
    cwe: CWE-798
    message: A database password in a connection string is exposed to anyone with repository or artifact access.
    fix: Use managed identity / integrated auth where possible, otherwise inject the connection string from a secret store or environment at deploy time.
    examples:
      bad: ['"Default": "Server=db;Database=app;User Id=sa;Password=S3cr3t!2024;"']
      good: ['"Default": "Server=db;Database=app;User Id=sa;Password=${DB_PASSWORD};"', '"Default": "Server=db;Integrated Security=true;"']

  - id: secret-url-credentials
    title: Credentials embedded in URL
    languages: [any]
    pattern: '\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqps?|https?)://[^\s:/@"''$]{1,64}:([^\s@/"''$]{4,})@'
    pattern_not: '://[^:]+:(?:\$\{|\{\{|<|password@|pass@|\*+@)'
    secret: true
    secret_group: 1
    severity: high
    confidence: medium
    owasp: A04
    cwe: CWE-798
    message: A URL of the form scheme://user:password@host carries a live credential.
    fix: Move the credential to a secret store / environment variable and build the URL at runtime.
    examples:
      bad: ['DATABASE_URL=postgres://app:Xy8Pq2Lm@db.internal:5432/app', 'amqp://guest:hunter22@rabbit:5672']
      good: ['DATABASE_URL=postgres://app:${DB_PASS}@db:5432/app', 'https://example.com/path']

  - id: secret-generic-assignment
    title: Hardcoded secret in assignment
    languages: [csharp, javascript, typescript, python, java, kotlin, swift, dart, go, php, ruby, yaml, json, env, ini, toml, xml, terraform, groovy]
    pattern: '(?i)(?:password|passwd|pwd|secret|api[_-]?key|access[_-]?key|auth[_-]?token|client[_-]?secret|private[_-]?key|signing[_-]?key)\w*["'']?\s*(?::=|[:=])\s*[`"'']([^"''`\s$]{8,})[`"'']'
    pattern_not: '(?i)(?:example|sample|dummy|changeme|placeholder|your[_-]|xxx+|\*{3,}|<[a-z_]+>|\$\{|\{\{|process\.env|os\.environ|getenv|Configuration\[)'
    secret: true
    secret_group: 1
    entropy_min: 3.0
    severity: high
    confidence: low
    owasp: A04
    cwe: CWE-798
    message: A string literal assigned to a secret-named key looks like a real credential.
    fix: Load it from configuration backed by a secret store (Key Vault, Secrets Manager, Vault, K8s secret) and rotate the exposed value.
    examples:
      bad: ['client_secret = "q8Zr2Lk9Vw3Xp7Nm"', '"ApiKey": "f3a9c1e7b2d84a6f"', 'jwtSecret := "Zp4k9Qm2Xv7Lr8Ns"', "const apiKey = 'Hq3Lp9Zt6Wm2Vx8R';"]
      good: ['client_secret = "changeme"', 'apiKey: process.env.API_KEY', 'password = "${PASSWORD}"']

  - id: secret-env-fallback
    title: Hardcoded secret used as fallback for a missing environment variable
    languages: [javascript, typescript, python]
    pattern: '(?i)(?:password|passwd|pwd|secret|api[_-]?key|access[_-]?key|auth[_-]?token|client[_-]?secret|private[_-]?key|signing[_-]?key)\w*["'']?\s*(?::=|[:=])\s*(?:process\.env(?:\.\w+|\[[^\]]+\])\s*(?:\|\||\?\?)\s*|os\.(?:environ\.get|getenv)\(\s*["''][^"'']+["'']\s*,\s*)[`"'']([^"''`\s$]{8,})[`"'']'
    pattern_not: '(?i)(?:example|sample|dummy|changeme|placeholder|your[_-]|xxx+|\*{3,}|<[a-z_]+>|\$\{|\{\{)'
    secret: true
    secret_group: 1
    entropy_min: 3.0
    severity: high
    confidence: medium
    owasp: A04
    cwe: CWE-798
    message: When the environment variable is unset (a new environment, a misconfigured deploy) the code silently runs with a secret that anyone with the source knows.
    fix: Fail at startup when the variable is missing instead of falling back, and rotate the exposed value — it is in git history.
    examples:
      bad: ["  jwtSecret: process.env.JWT_SECRET || 'Zp4k9Qm2Xv7Lr8Ns-2024',", 'API_KEY = os.environ.get("API_KEY", "Hq3Lp9Zt6Wm2Vx8R")', "const secret = process.env['SIGNING_KEY'] ?? 'q8Zr2Lk9Vw3Xp7Nm';"]
      good: ["jwtSecret: process.env.JWT_SECRET || 'changeme'", "apiKey: process.env.API_KEY || ''", 'API_KEY = os.environ["API_KEY"]']

  - id: secret-env-file
    title: .env file committed
    languages: [env]
    path_pattern: '(^|/)\.env(\.[\w-]+)?$'
    file_excludes: '(?i)^\s*#\s*(template|example)'
    paths:
      exclude: ["*.example", "*.sample", "*.template", "*/.env.example", ".env.example"]
    severity: medium
    confidence: medium
    owasp: A02
    cwe: CWE-538
    message: Environment files usually hold real credentials for local or deployed environments.
    fix: Remove it from the repo, add `.env*` to .gitignore (keep a `.env.example` with placeholders), rotate any real values it held.
    examples:
      file: .env.production
      bad: ["DB_PASSWORD=abc"]
